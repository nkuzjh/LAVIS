model:
  arch: blip2
  model_type: coco
  use_grad_checkpoint: False
  # load_finetuned: True
  # finetuned: "/home/zhh/ssd/excute/deeplearning/projects/TTA_MM_Retrieval/LAVIS/lavis/output/BLIP2/Retrieval_COCO_zhh_lr5e-6_wd0_QfomerTentwoUnc_topk_gradacc_offline_multiepochs5/20250529105/i2t_tta_model_model_epoch_1.pth"

datasets:
  coco_retrieval: # name of the dataset builder
    vis_processor:
        train:
          name: "blip_image_train"
          image_size: 364
        eval:
          name: "blip_image_eval"
          image_size: 364
    text_processor:
        train:
          name: "blip_caption"
        eval:
          name: "blip_caption"
#     build_info:
#         images:
#             storage: '/export/share/datasets/vision/coco/images/'
run:
  task: retrieval

  # dataloading
  num_workers: 4
  batch_size_train: 16
  batch_size_eval: 16

  train_splits: ["train"]
  valid_splits: ["val"]
  test_splits: ["test"]

  # distribution
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
  use_dist_eval_sampler: False

  # model specific
  k_test: 128

  # misc
  seed: 42
  output_dir: "output/BLIP2/Retrieval_COCO_itm_adapt_exp9.0.1/i2t"

  evaluate: True

tta:
  name: "itm_adapt_v2"
  adapt_module: "qformer"
  # entropy_type: "softmax"
  k_tta: 16
  # temper: 1.0
  top1_match_coeffi: True
  # top1_match_coeffi_src: "softmax" #"sigmoid" # this param will be used when top1_match_coeffi=True
  coeffi_i2t_temper: 100.0
  coeffi_t2i_temper: 20.0
  sample_selection: "all"

  init_lr: 1e-4
  weight_decay: 0.0
  tta_bs: 8
  grad_accum_bs: 1
  offline_multi_epochs: 10
 
  tta_task: "i2t" # "i2t" or "t2i"
  # wo_rerank: False
  # online: False
  zero_shot_eval: False
  debug_visual: True
  log_iters: 50
